<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CADT Store</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 650px;
        font-family: Arial, sans-serif;
      }
      th,
      td {
        border: 1px solid black;
        padding: 6px 12px;
        text-align: left;
      }
      th {
        background-color: #d9d9d9;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to CADT store</h1>
    <table>
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>In Stock</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Controller</td>
          <td>$20</td>
          <td>5</td>
          <td>YES</td>
        </tr>
        <tr>
          <td>VR box</td>
          <td>$5</td>
          <td>60</td>
          <td>YES</td>
        </tr>
        <tr>
          <td>Both Item</td>
          <td>$23</td>
          <td>3</td>
          <td>YES</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
