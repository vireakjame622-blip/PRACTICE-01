<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <div class="profile-avatar-wrapper">
                <img 
                    src="jame.jpg" 
                    alt="Profile Picture" 
                    class="profile-img"
                >
            </div>
        </div>
        <div class="card-body">
            <div class="name-container">
                <h2 class="profile-name">VIREAK JAME</h2>
                <span class="verified-badge"><i class="fa-solid fa-circle-check"></i></span>
            </div>
            <p class="stats-text" style="color: #65676b; font-weight: 500;">
                <strong>02</strong> followers &bull; <strong>999</strong> following
            </p>
            <div class="profile-bio">
                <p><i class="fa-solid fa-briefcase"></i> Designer</p>
                <p><i class="fa-solid fa-location-dot"></i> Phnom Penh</p>
                <p><i class="fa-solid fa-graduation-cap"></i> Cambodia Academy of Digital Technology</p>
                <p class="bio">Welcome to my facebook account</p>
            </div>
            
            <div class="social-links-container">
                <a href="https://www.instagram.com/jemvireak?srtk=M25jZHlwcGx2cTNt&utm_source=qr" target="_blank" class="social-badge instagram" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://github.com/vireakjame622-blip/Veloran.git" target="_blank" class="social-badge github" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://t.me/VIREAKJAME04" target="_blank" class="social-badge telegram" title="Telegram">
                    <i class="fa-brands fa-telegram"></i>
                </a>
                
            </div>

            <button type="button" class="action-btn">
                <i class="fa-solid fa-chart-simple"></i> Dashboard
            </button>
        </div>
    </div>

</body>
</html>
